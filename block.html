<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page indisponible</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, sans-serif; background: #f4f6fb; color: #202431; }
    main { width: min(100%, 520px); padding: 32px; border-radius: 18px; background: white; box-shadow: 0 12px 40px #17213b14; text-align: center; }
    h1 { margin: 0 0 12px; font-size: clamp(1.5rem, 5vw, 2rem); }
    p { line-height: 1.6; color: #555d70; }
    .notice { margin-top: 20px; padding: 14px; border-radius: 12px; background: #fff4db; color: #704c00; }
  </style>
</head>
<body>
  <main>
    <h1>Page temporairement indisponible</h1>
    <p>Cette page n’est pas disponible pour le moment. Réessaie plus tard.</p>
    <p class="notice"><strong>Conseil de sécurité :</strong> ne saisis pas ton mot de passe Roblox ni des informations personnelles sur un site non officiel.</p>
  </main>
</body>
</html>
